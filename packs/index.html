<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4fb">
<title>Card Packs · Zenji Cards</title>
<meta name="description" content="Buy 5 Zenji Cards at once and save.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/zc.css">
<link rel="icon" href="../assets/icon-180.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 48px); line-height: 1.05; }
  .lead { margin: 0; color: var(--ink-2); font-size: 17px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 14px; }
  .save { font-weight: 800; color: var(--good); }
  .owned { display: grid; gap: 8px; }
  .owned div { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); font-weight: 700; }
  .owned code { font: 800 15px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header class="zc-top">
  <a class="zc-logo" href="../"><b>Zenji Cards</b><span>by Zenjishoppazz</span></a>
</header>
<main class="wrap" id="main"></main>
<script src="../assets/zc.js"></script>
<script>
(async () => {
  const { h, api, money, store, packs } = ZC;
  const main = document.getElementById("main");
  const params = new URLSearchParams(location.search);
  // Remember where to go back to (Flutterwave's return keeps no other query).
  if (params.get("back")) { try { sessionStorage.setItem("zc:packBack", params.get("back")); } catch (_) {} }
  let back = params.get("back");
  try { back = back || sessionStorage.getItem("zc:packBack"); } catch (_) {}
  const backLink = back && /^[a-z-]{2,20}$/.test(back) ? "../" + back + "/" : "../";
  const cat = await ZC.getCatalog();
  const p = cat.pack;

  async function confirmPurchase(ref) {
    main.replaceChildren(h("div", { class: "card" }, h("div", { class: "zc-spinner" }), h("h2", { text: "Checking your payment" }), h("p", { class: "lead", text: "This can take a few seconds for mobile money." })));
    for (let i = 0; i < 10; i++) {
      const r = await api("POST", "/packs/confirm", { tx_ref: ref });
      if (r.ok) {
        packs.put({ code: r.data.code, left: r.data.credits_left });
        history.replaceState(null, "", location.pathname);
        const copy = h("button", { class: "zc-btn", type: "button", text: "Copy code", onclick: async () => {
          try { await navigator.clipboard.writeText(r.data.code); copy.textContent = "Copied"; } catch (_) { copy.textContent = "Select the code to copy it"; }
        } });
        main.replaceChildren(h("h1", { text: "Your pack is ready" }),
          h("div", { class: "card" },
            h("p", { class: "lead", text: "Your code for " + r.data.credits_total + " cards:" }),
            h("div", { class: "zc-big-code", text: r.data.code }), copy,
            h("p", { class: "zc-note", text: "It's saved on this phone and appears when you pay for a card. Write it down too, so you can use it on another phone." })),
          h("a", { class: "zc-btn primary block", href: backLink, text: back ? "Back to my card" : "Make a card" }));
        return;
      }
      if (/did not go through/.test(r.message)) break;
      await new Promise((res) => setTimeout(res, 3000));
    }
    main.replaceChildren(h("h1", { text: "Payment not received yet" }),
      h("p", { class: "lead", text: "If money left your account, wait a minute and check again." }),
      h("button", { class: "zc-btn primary", type: "button", text: "Check again", onclick: () => confirmPurchase(ref) }),
      h("a", { class: "zc-btn ghost", href: location.pathname, text: "Back" }));
  }

  if (params.get("tx_ref")) {
    if (params.get("status") === "cancelled") {
      main.append(h("div", { class: "card" }, h("h2", { text: "Payment cancelled" }), h("p", { class: "lead", text: "No money was taken." })));
    } else {
      return confirmPurchase(params.get("tx_ref"));
    }
  }

  const cur0 = store.get("zc:currency", ZC.guessCurrency());
  const opt = (cur, title, methods) => h("label", { class: "zc-option" },
    h("input", { type: "radio", name: "cur", value: cur, checked: cur === cur0 }),
    h("div", {}, h("b", { text: title }), h("div", { class: "zc-paylogos" }, methods.map((m) => h("span", { text: m })))),
    h("span", { class: "amt", text: money(cur, p[cur]) }));
  const options = h("div", { class: "zc-options" },
    opt("TZS", "Pay in Tanzania (TSh)", ["M-Pesa", "Mixx by Yas", "Airtel Money", "Card"]),
    opt("USD", "Pay from anywhere (USD)", ["Card", "Apple Pay", "Google Pay"]));
  const email = h("input", { type: "email", placeholder: "you@example.com", value: store.get("zc:email", ""), autocomplete: "email" });
  const err = h("p", { class: "zc-error", hidden: true, role: "alert" });
  const pay = h("button", { class: "zc-btn primary block", type: "button" });
  const label = () => { const c = options.querySelector("input:checked").value; pay.textContent = "Pay " + money(c, p[c]); };
  options.addEventListener("change", label);
  pay.addEventListener("click", async () => {
    const c = options.querySelector("input:checked").value;
    store.set("zc:currency", c); store.set("zc:email", email.value.trim());
    pay.disabled = true; pay.textContent = "Opening payment…"; err.hidden = true;
    const ret = location.origin + location.pathname;
    const r = await api("POST", "/packs/checkout", { currency: c, return_url: ret, email: email.value.trim() || null });
    if (!r.ok) { pay.disabled = false; label(); err.textContent = r.message; err.hidden = false; return; }
    location.href = r.data.checkout_url;
  });
  const singles = (c) => cat.card[c] * p.credits;
  const saving = Math.round((1 - p.TZS / singles("TZS")) * 100);
  main.append(
    h("h1", { text: p.credits + " cards, one payment" }),
    h("p", { class: "lead", text: "Use them on any card: birthdays, Eid, apologies, certificates, quizzes. Each card you unlock uses one." }),
    h("div", { class: "card" },
      saving > 0 ? h("div", { class: "save", text: "Save " + saving + "% compared to paying one by one" }) : null,
      options,
      h("label", { class: "zc-field" }, h("span", { text: "Email (optional)" }), email, h("small", { text: "Flutterwave sends your receipt here." })),
      err, pay,
      h("p", { class: "zc-note", text: "Secure payment by Flutterwave." })));
  label();

  const owned = packs.all();
  if (owned.length) {
    const box = h("div", { class: "owned" });
    main.append(h("h2", { text: "Packs on this phone", style: { margin: "8px 0 0" } }), box);
    for (const pk of owned) {
      const left = h("span", { text: pk.left + " left" });
      box.append(h("div", {}, h("code", { text: pk.code }), left));
      api("GET", "/packs/" + encodeURIComponent(pk.code)).then((r) => { if (r.ok) { left.textContent = r.data.credits_left + " left"; packs.put({ code: pk.code, left: r.data.credits_left }); } });
    }
  }
})();
</script>
</body>
</html>
