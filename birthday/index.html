<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160f26">
<title>Blow Out the Candles · Zenji Cards</title>
<meta name="description" content="A birthday cake with real candles: shake your phone to blow them out.">
<meta property="og:title" content="Someone baked you a cake 🎂">
<meta property="og:description" content="Open it, make a wish and shake your phone to blow out the candles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/zc.css">
<link rel="icon" href="../assets/icon-180.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<style>
  /* Birthday stage: a dark party room, cake in the middle. */
  .bd { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; color: #fff4e6; font-family: var(--body);
        background: radial-gradient(120% 80% at 50% 70%, #2a1846, #160f26 70%); overflow: hidden; -webkit-user-select: none; user-select: none; }
  .bd header { text-align: center; display: grid; gap: 4px; padding: 6% 16px 0; z-index: 2; }
  .bd .eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #c9b8e8; font-weight: 800; }
  .bd h1 { margin: 0; font-family: var(--display); font-weight: 400; line-height: 1.05; color: #ffc65c; text-wrap: balance;
           font-size: clamp(26px, 9cqw, 58px); text-shadow: 0 0 24px rgba(255,198,92,.35); }
  .bd h1 .name { color: #ffd3e2; display: block; }
  .bd canvas { width: 100%; height: 100%; display: block; min-height: 0; touch-action: manipulation; }
  .bd .hint { text-align: center; padding: 0 16px 12%; min-height: 70px; display: grid; gap: 8px; justify-items: center; z-index: 2; }
  .bd .hint p { margin: 0; font-weight: 700; font-size: 16px; max-width: 32ch; }
  .bd .hint small { color: #c9b8e8; }
  .bd .note { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); width: min(88%, 380px); z-index: 4;
              background: #fff4e6; color: #2a1846; border-radius: 18px; padding: 18px; display: grid; gap: 10px; text-align: center;
              box-shadow: 0 18px 40px rgba(0,0,0,.4); animation: bd-pop .6s cubic-bezier(.2,1.5,.4,1) both; }
  .bd .note img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; }
  .bd .note p { margin: 0; font-size: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bd .note .from { font-family: var(--display); color: #e8457c; font-size: 18px; }
  .bd .again { background: transparent; color: #2a1846; border: 1.5px solid rgba(42,24,70,.25); border-radius: 999px; padding: 8px 16px; font-weight: 700; cursor: pointer; justify-self: center; }
  @keyframes bd-pop { from { transform: translate(-50%, 20px) scale(.9); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bd .note { animation: none; } }
  .zc-stage { container-type: inline-size; }
</style>
</head>
<body>
<script src="../assets/zc.js"></script>
<script>
(() => {
  const TUNE = [ // "Happy Birthday to You" (traditional), as [note, beats]
    ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
    ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
    ["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2],
    ["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 2.5]];
  const FREQ = { G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784 };
  const COLORS = ["#7fd1ff", "#ff9ec4", "#ffe07a", "#9ff0c1", "#c7a6ff"];

  ZC.card({
    type: "birthday",
    name: "Blow out the candles",
    lead: "A cake with real candles. They open it, make a wish and shake their phone to blow the candles out. Then your message appears.",
    defaults: { to: "", age: "", message: "Happy birthday! Wishing you a year full of good things.", from: "" },
    fields: [
      { key: "to", label: "Their name", required: true, max: 30, placeholder: "Mkali" },
      { type: "row", fields: [
        { key: "age", label: "Age", type: "number", min: 1, maxValue: 120, help: "1 to 9 shows that many candles" },
        { key: "from", label: "From", max: 40, placeholder: "Your name" },
      ] },
      { key: "message", label: "Your message", type: "textarea", max: 400, required: true, help: "Shown after the candles go out." },
    ],
    photos: 1,
    photoLabel: "Photo for the message (optional)",
    title: (d) => "Happy Birthday " + (d.to || ""),
    shareText: (d) => "Happy birthday " + (d.to || "") + "! 🎂 Open this and make a wish:",
    coverTitle: (d) => (d.to ? d.to + ", someone" : "Someone") + " baked you a cake",
    coverText: () => "Turn your sound on, make a wish, then shake your phone (or tap the cake) to blow out the candles.",
    coverButton: "Light the candles",
    // Old free links: #Mkali or #Mkali-5
    legacy(hash) {
      let raw = ""; try { raw = decodeURIComponent(hash); } catch (_) { return null; }
      const m = raw.replace(/^\/+|\/+$/g, "").match(/^([\p{L}\p{N}-]*?)(?:-(\d{1,3}))?$/u);
      if (!m || !m[1]) return null;
      return { to: m[1].replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()), age: m[2] ? Number(m[2]) : "", message: "", from: "" };
    },

    render(root, d, ctx) {
      const { h } = ctx;
      const age = Number(d.age) || 0;
      const n = age >= 1 && age <= 9 ? age : 7;
      const nameEl = h("span", { class: "name", text: d.to || "" });
      const eyebrow = h("div", { class: "eyebrow", text: "Make a wish" });
      const canvas = h("canvas", { "aria-label": "A birthday cake with lit candles" });
      const hint = h("div", { class: "hint", "aria-live": "polite" });
      const box = h("div", { class: "bd" }, h("header", {}, eyebrow, h("h1", {}, "Happy Birthday", nameEl)), canvas, hint);
      root.append(box);
      const g = canvas.getContext("2d");
      let W = 0, H = 0, raf = 0, wind = 0, windDir = 1, done = false, started = false;
      const candles = Array.from({ length: n }, (_, i) => ({ lit: true, flame: 1, lean: 0, phase: Math.random() * 6.28, color: COLORS[i % 5], x: 0, y: 0, h: 0 }));
      const smoke = [];
      let cake = { cx: 0, top: 0, w: 0, h: 0 };

      function size() {
        const dpr = Math.min(devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect();
        W = r.width; H = r.height; canvas.width = Math.max(1, W * dpr); canvas.height = Math.max(1, H * dpr);
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        const w = Math.min(W * 0.78, H * 0.95, 360), ch = w * 0.5;
        cake = { cx: W / 2, top: H * 0.48 + ch * 0.05, w, h: ch };
        const span = w * 0.74;
        candles.forEach((c, i) => {
          const t = n === 1 ? 0.5 : i / (n - 1), dx = (t - 0.5) * 2;
          c.x = cake.cx - span / 2 + span * t; c.y = cake.top + (1 - dx * dx) * w * 0.035 + w * 0.02; c.h = w * 0.2 + (i % 2) * w * 0.02;
        });
      }
      const ro = new ResizeObserver(size); ro.observe(canvas);

      const rr = (x, y, w, hh, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
      const shade = (hex, a) => { const v = parseInt(hex.slice(1), 16); const f = (x) => Math.max(0, Math.min(255, x + a)); return `rgb(${f(v >> 16)},${f((v >> 8) & 255)},${f(v & 255)})`; };

      function drawCake(glow) {
        const { cx, top, w, h: ch } = cake;
        g.fillStyle = "rgba(255,244,230,.12)"; g.beginPath(); g.ellipse(cx, top + ch + 8, w * 0.62, w * 0.09, 0, 0, 7); g.fill();
        [{ y: top + ch * 0.48, hh: ch * 0.52, ww: w, base: "#8a4fc9", band: "#ffd3e2" }, { y: top, hh: ch * 0.5, ww: w * 0.86, base: "#b46bdc", band: "#fff4e6" }].forEach((L) => {
          const lx = cx - L.ww / 2, gr = g.createLinearGradient(lx, 0, lx + L.ww, 0);
          gr.addColorStop(0, shade(L.base, -18)); gr.addColorStop(.5, L.base); gr.addColorStop(1, shade(L.base, -28));
          g.fillStyle = gr; rr(lx, L.y, L.ww, L.hh, 14); g.fill();
          g.fillStyle = L.band; g.beginPath(); g.moveTo(lx, L.y + 10);
          for (let i = 0; i <= 9; i++) { const px = lx + (L.ww / 9) * i; g.quadraticCurveTo(px - L.ww / 18, L.y + 18 + ((i * 37) % 3) * 7, px, L.y + 10); }
          g.lineTo(lx + L.ww, L.y); g.lineTo(lx, L.y); g.closePath(); g.fill(); rr(lx, L.y - 2, L.ww, 14, 10); g.fill();
          for (let i = 0; i < 14; i++) {
            g.save(); g.translate(lx + 14 + ((i * 53) % Math.max(1, L.ww - 28)), L.y + 26 + ((i * 29) % Math.max(8, L.hh - 36))); g.rotate(i);
            g.fillStyle = COLORS[i % 5]; rr(-4, -1.5, 8, 3, 1.5); g.fill(); g.restore();
          }
        });
        if (glow > 0) {
          const gr = g.createRadialGradient(cx, top, 10, cx, top, w * 0.9);
          gr.addColorStop(0, `rgba(255,198,92,${0.28 * glow})`); gr.addColorStop(1, "rgba(255,198,92,0)");
          g.fillStyle = gr; g.beginPath(); g.arc(cx, top, w * 0.9, 0, 7); g.fill();
        }
      }
      function drawCandle(c, t) {
        const cw = Math.max(8, cake.w * 0.032);
        g.save(); rr(c.x - cw / 2, c.y - c.h, cw, c.h, 3); g.fillStyle = c.color; g.fill(); g.clip();
        g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 3;
        for (let y = c.y - c.h - cw; y < c.y; y += 9) { g.beginPath(); g.moveTo(c.x - cw, y); g.lineTo(c.x + cw, y + 7); g.stroke(); }
        g.restore();
        g.strokeStyle = "#3b2a2a"; g.lineWidth = 2; g.beginPath(); g.moveTo(c.x, c.y - c.h); g.lineTo(c.x, c.y - c.h - 7); g.stroke();
        if (c.flame <= 0.02) return;
        const fl = ctx.reduceMotion ? 1 : 1 + Math.sin(t * 0.012 + c.phase) * 0.08 + Math.sin(t * 0.031 + c.phase * 2) * 0.05;
        const fh = cw * 2.6 * c.flame * fl, fw = cw * 0.9 * c.flame, bx = c.x, by = c.y - c.h - 6, tip = bx + c.lean * fh * 0.9;
        const halo = g.createRadialGradient(bx, by - fh * .5, 1, bx, by - fh * .5, fh * 2.2);
        halo.addColorStop(0, `rgba(255,190,90,${.35 * c.flame})`); halo.addColorStop(1, "rgba(255,190,90,0)");
        g.fillStyle = halo; g.beginPath(); g.arc(bx, by - fh * .5, fh * 2.2, 0, 7); g.fill();
        const gr = g.createLinearGradient(bx, by, bx, by - fh);
        gr.addColorStop(0, "#ff7a1a"); gr.addColorStop(.55, "#ffc65c"); gr.addColorStop(1, "#fff6d8"); g.fillStyle = gr;
        g.beginPath(); g.moveTo(bx, by + 2);
        g.bezierCurveTo(bx - fw, by - fh * .2, bx - fw * .6 + c.lean * fh * .4, by - fh * .7, tip, by - fh);
        g.bezierCurveTo(bx + fw * .6 + c.lean * fh * .4, by - fh * .7, bx + fw, by - fh * .2, bx, by + 2); g.fill();
        g.fillStyle = "rgba(120,170,255,.75)"; g.beginPath(); g.ellipse(bx, by - fh * .12, fw * .28, fh * .16, 0, 0, 7); g.fill();
      }
      function frame(t) {
        g.clearRect(0, 0, W, H); wind *= 0.9;
        drawCake(candles.filter((c) => c.lit).length / n);
        candles.forEach((c) => {
          c.lean += ((c.lit ? windDir * wind * 0.9 : 0) - c.lean) * 0.25;
          c.flame += ((c.lit ? 1 - wind * 0.45 : 0) - c.flame) * (c.lit ? 0.2 : 0.35);
          drawCandle(c, t);
        });
        for (let i = smoke.length - 1; i >= 0; i--) {
          const p = smoke[i]; p.x += p.vx + Math.sin((t + i * 90) * 0.004) * 0.3; p.y += p.vy; p.r += 0.18; p.life -= 0.012;
          if (p.life <= 0) { smoke.splice(i, 1); continue; }
          g.fillStyle = `rgba(220,215,235,${p.life * 0.35})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
        }
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      function say(text, small) { hint.replaceChildren(h("p", { text }), small ? h("small", { text: small }) : ""); }
      function fizz() {
        if (!ctx.sound.on) return;
        ctx.sound.tone(2400, 0, 0.18, 0.05, "sawtooth");
      }
      function gust(strength) {
        if (done || !started) return;
        wind = Math.min(1, wind + strength); windDir = Math.random() < 0.5 ? -1 : 1;
        if (strength <= 0.45) return;
        const lit = candles.filter((c) => c.lit);
        const k = Math.min(lit.length, strength > 0.85 ? 3 : strength > 0.65 ? 2 : 1);
        for (let i = 0; i < k; i++) {
          const c = lit.splice(Math.floor(Math.random() * lit.length), 1)[0]; c.lit = false; fizz();
          for (let j = 0; j < 9; j++) smoke.push({ x: c.x, y: c.y - c.h, vx: (Math.random() - .5) * .5, vy: -0.6 - Math.random() * .7, r: 3 + Math.random() * 3, life: 1 });
        }
        const left = candles.filter((c) => c.lit).length;
        if (left === 0) celebrate();
        else say(left === 1 ? "One left!" : left + " candles left. Keep going!");
      }
      function celebrate() {
        done = true;
        ctx.confetti();
        if (ctx.sound.on) ctx.sound.chime();
        if (!ctx.preview && navigator.vibrate) navigator.vibrate([60, 40, 120]);
        eyebrow.textContent = "Your wish is on its way";
        hint.replaceChildren();
        const note = h("div", { class: "note" },
          ctx.photos[0] ? h("img", { src: ctx.photos[0], alt: "" }) : null,
          d.message ? h("p", { text: d.message }) : h("p", { text: "May every wish come true." }),
          d.from ? h("div", { class: "from", text: "— " + d.from }) : null,
          h("button", { class: "again", type: "button", text: "Light them again", onclick: () => {
            note.remove(); candles.forEach((c) => (c.lit = true)); done = false; eyebrow.textContent = "Make a wish"; say(prompt());
          } }));
        box.append(note);
      }
      const prompt = () => (ctx.motionWorks ? "Make a wish, then shake your phone" : "Make a wish, then tap the cake");

      canvas.addEventListener("pointerdown", () => gust(0.55 + Math.random() * 0.25));
      const offShake = ctx.onShake((s) => { if (s.sway > 6) wind = Math.min(1, wind + s.sway / 120); if (s.big) gust(Math.min(1, 0.35 + s.sway / 60)); });

      function playTune() {
        if (!ctx.sound.on) return;
        let t = 0.15; TUNE.forEach(([nn, b]) => { ctx.sound.tone(FREQ[nn], t, b * 0.67, 0.15); ctx.sound.tone(FREQ[nn] * 2, t, b * 0.34, 0.03, "sine"); t += b * 0.42; });
      }
      return {
        start() { started = true; say(ctx.preview ? "Tap the cake to try it" : "Make a wish, then shake your phone to blow out the candles"); playTune(); },
        motionChecked(ok) { if (!ok && !done) say("Tap the cake to blow out the candles", "Shaking works on phones that allow motion"); },
        destroy() { cancelAnimationFrame(raf); ro.disconnect(); offShake(); },
      };
    },
  });
})();
</script>
</body>
</html>
