<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bfe6ff">
<title>Pop the Balloons · Zenji Cards</title>
<meta name="description" content="A thank-you card: pop each balloon to read why you're thankful.">
<meta property="og:title" content="Thank you 🎈">
<meta property="og:description" content="Pop the balloons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/zc.css">
<link rel="icon" href="../assets/icon-180.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<style>
  /* Thank-you stage: a bright sky full of balloons; each one hides a reason. */
  .ty { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(#bfe6ff, #e8f6ff 60%, #fff7e0); color: #12324a; font-family: var(--body); -webkit-user-select: none; user-select: none; }
  .ty header { position: absolute; top: 5%; left: 0; right: 0; text-align: center; padding: 0 16px; z-index: 3; display: grid; gap: 4px; }
  .ty .eyebrow { font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: 12px; color: #2f6f99; }
  .ty h1 { margin: 0; font-family: var(--display); font-weight: 400; color: #e8457c; font-size: clamp(28px, 10cqw, 52px); line-height: 1.05; text-wrap: balance; }
  .ty .hint { font-weight: 700; font-size: 14px; color: #2f6f99; }
  .ty .balloon { position: absolute; width: 22%; max-width: 110px; aspect-ratio: 5 / 8; cursor: pointer; border: 0; padding: 0; background: none;
                 animation: ty-float var(--dur, 7s) ease-in-out infinite alternate; touch-action: manipulation; }
  .ty .balloon svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 8px rgba(18,50,74,.18)); }
  .ty .balloon.popped { pointer-events: none; animation: ty-pop .25s ease-out forwards; }
  .ty .reasons { position: absolute; left: 0; right: 0; bottom: 9%; display: grid; gap: 8px; justify-items: center; padding: 0 16px; z-index: 4; }
  .ty .reason { background: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 700; max-width: 36ch; text-align: center; box-shadow: 0 6px 14px rgba(18,50,74,.12);
                animation: ty-in .45s cubic-bezier(.2,1.5,.4,1) both; overflow-wrap: anywhere; }
  .ty .final { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; padding: 24px; text-align: center; background: rgba(255,255,255,.55); backdrop-filter: blur(3px); animation: ty-in .6s both; }
  .ty .final .card { background: #fff; border-radius: 22px; padding: 22px; display: grid; gap: 12px; max-width: 380px; box-shadow: 0 20px 44px rgba(18,50,74,.2); }
  .ty .final h2 { margin: 0; font-family: var(--display); font-weight: 400; color: #e8457c; font-size: clamp(34px, 12cqw, 56px); line-height: 1; }
  .ty .final p { margin: 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ty .final ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; text-align: left; }
  .ty .final li::before { content: "✓ "; color: #1f8a4c; font-weight: 800; }
  .ty .final .from { font-family: var(--display); color: #2f6f99; }
  .ty .final img { width: 100%; max-height: 170px; object-fit: cover; border-radius: 14px; }
  @keyframes ty-float { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-14px) rotate(3deg); } }
  @keyframes ty-pop { to { transform: scale(1.5); opacity: 0; } }
  @keyframes ty-in { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ty .balloon { animation: none; } .ty .reason, .ty .final { animation: none; } }
  .zc-stage { container-type: inline-size; }
</style>
</head>
<body>
<script src="../assets/zc.js"></script>
<script>
(() => {
  const COLORS = ["#e8457c", "#ffb000", "#3aa0e8", "#2bb673", "#9b6bff", "#ff7a45"];
  ZC.card({
    type: "thank-you",
    name: "Pop the balloons",
    lead: "Each balloon hides one thing you are thankful for. They pop them one by one, then your thank-you note appears.",
    defaults: {
      to: "", from: "", headline: "Thank you",
      reasons: ["for always picking up when I call", "for the late-night help", "for believing in me"],
      message: "I don't say it enough. You made a real difference.",
    },
    fields: [
      { type: "row", fields: [
        { key: "to", label: "Their name", required: true, max: 30, placeholder: "Mwalimu Salma" },
        { key: "from", label: "From", max: 40, placeholder: "Your name" },
      ] },
      { key: "headline", label: "Headline", max: 30, required: true, help: "Thank you, Asante sana, Shukran…" },
      { key: "reasons", label: "Thank you…", type: "list", max: 90, maxItems: 6, placeholder: "for…", help: "One per balloon (up to 6)." },
      { key: "message", label: "Closing note", type: "textarea", max: 300 },
    ],
    photos: 1,
    photoLabel: "Photo in the closing note (optional)",
    validate: (d) => ((d.reasons || []).filter((r) => String(r).trim()).length ? null : "Add at least one reason."),
    title: (d) => (d.headline || "Thank you") + (d.to ? ", " + d.to : ""),
    shareText: (d) => (d.headline || "Thank you") + (d.to ? ", " + d.to : "") + " 🎈",
    coverTitle: (d) => (d.to ? d.to + ", these" : "These") + " balloons are for you",
    coverText: () => "Sound on. Pop every balloon.",
    coverButton: "Open",
    footDark: true,

    render(root, d, ctx) {
      const { h } = ctx;
      const reasons = (d.reasons || []).map((r) => String(r || "").trim()).filter(Boolean);
      const hint = h("div", { class: "hint", text: "Pop the balloons" });
      const list = h("div", { class: "reasons", "aria-live": "polite" });
      const box = h("div", { class: "ty" },
        h("header", {}, h("div", { class: "eyebrow", text: d.to ? "For " + d.to : "For you" }), h("h1", { text: d.headline || "Thank you" }), hint),
        list);
      root.append(box);
      let left = reasons.length;
      const prefix = (r) => (/^(for|to|because)\b/i.test(r) ? "Thank you " + r : r);

      // Spread balloons in a loose grid in the middle of the sky.
      const cols = reasons.length > 4 ? 3 : Math.max(2, reasons.length);
      reasons.forEach((r, i) => {
        const color = COLORS[i % COLORS.length];
        const b = h("button", { class: "balloon", type: "button", "aria-label": "Pop balloon " + (i + 1) });
        b.innerHTML = `<svg viewBox="0 0 50 80"><path d="M25 2C12 2 4 12 4 25c0 15 11 27 21 31 10-4 21-16 21-31C46 12 38 2 25 2z" fill="${color}"/><path d="M14 14c3-4 7-6 11-6" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M22 56l3 5 3-5z" fill="${color}"/><path d="M25 61c-4 6 4 10 0 18" stroke="#5b7a8f" stroke-width="1.2" fill="none"/></svg>`;
        const row = Math.floor(i / cols), col = i % cols, inRow = Math.min(cols, reasons.length - row * cols);
        b.style.left = ((col + 0.5) / inRow * 100 - 11) + "%";
        b.style.top = (24 + row * 22 + (col % 2) * 5) + "%";
        b.style.setProperty("--dur", (5 + Math.random() * 3).toFixed(1) + "s");
        b.style.animationDelay = (-Math.random() * 4).toFixed(1) + "s";
        b.addEventListener("click", () => {
          b.classList.add("popped");
          if (ctx.sound.on) ctx.sound.pop();
          if (!ctx.preview && navigator.vibrate) navigator.vibrate(25);
          list.append(h("div", { class: "reason", text: prefix(r) }));
          while (list.children.length > 3) list.firstChild.remove();
          left--;
          hint.textContent = left ? left + " to go" : "";
          if (!left) setTimeout(finale, 700);
        });
        box.append(b);
      });

      function finale() {
        list.remove();
        ctx.confetti({ colors: COLORS, count: 140 });
        if (ctx.sound.on) ctx.sound.chime();
        box.append(h("div", { class: "final" }, h("div", { class: "card" },
          h("h2", { text: d.headline || "Thank you" }),
          ctx.photos[0] ? h("img", { src: ctx.photos[0], alt: "" }) : null,
          h("ul", {}, reasons.map((r) => h("li", { text: prefix(r) }))),
          d.message ? h("p", { text: d.message }) : null,
          d.from ? h("div", { class: "from", text: "— " + d.from }) : null)));
      }
      return { destroy() {} };
    },
  });
})();
</script>
</body>
</html>
